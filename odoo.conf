; Floatra Odoo Connector — dev config.
;
; Loaded by docker-compose into /etc/odoo/odoo.conf inside the
; odoo container. Production deployments at distributor sites
; will use their own config; this file is just for local dev.

[options]
; ---- Database ----
; Hostname is the compose service name, NOT localhost. The Odoo
; container reaches Postgres via the internal compose network.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; ---- Addons ----
; addons_path resolution order: built-in addons first (always
; needed for base/sale/etc.), then our extra-addons mount.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ---- Networking ----
; Bind only to the internal interface inside the container; the
; compose port mapping handles 127.0.0.1:8069 → container:8069.
; xmlrpc_interface left blank = bind to all (inside the container).
xmlrpc_port = 8069

; ---- Logging ----
log_level = info
log_handler = :INFO,floatra_credit:DEBUG
logfile = False

; ---- Dev convenience ----
; Disable demo data by default — keeps the database lean. Set on
; a per-install basis when needed via `--without-demo=all` / not.
without_demo = all
; Auto-restart on file changes when --dev=all is passed.
; Master password for the manage screen (create/duplicate/drop
; database). Dev only; change for any non-local deployment.
admin_passwd = floatra-dev-master

; ---- Workers ----
; 0 workers = single-process mode. Easier to attach a debugger,
; lower memory footprint. Production needs 2-4 workers per CPU.
workers = 0
